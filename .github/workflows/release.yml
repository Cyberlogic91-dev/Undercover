name: Release APK

# Publication automatique : dès qu'un nouveau versionName arrive sur main
# (app/build.gradle.kts), l'APK est compilé, signé et publié en release « vX.Y ».
# Si la release de cette version existe déjà, rien n'est fait.
on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'CHANGELOG-latest.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Environnement protégé : configurer un « Required reviewer » dans
    # Settings › Environments › release, et y ranger le secret UC_KEYSTORE_B64.
    # Ainsi, aucune version ne peut être signée et publiée sans validation manuelle.
    environment: release
    steps:
      # Actions épinglées par empreinte de commit (protection contre une action compromise)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Vérifier le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Version à publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$VERSION existe déjà : rien à publier."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: env.SKIP == 'false'
        with:
          distribution: temurin
          java-version: '21'

      # Le SDK Android est déjà installé sur les machines ubuntu-latest (ANDROID_HOME)

      - name: Clé de signature
        if: env.SKIP == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.UC_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secrets de signature absents : UC_KEYSTORE_B64, UC_STORE_PASSWORD, UC_KEY_ALIAS, UC_KEY_PASSWORD (Settings › Secrets and variables › Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "UC_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        if: env.SKIP == 'false'
        env:
          UC_STORE_PASSWORD: ${{ secrets.UC_STORE_PASSWORD || 'android' }}
          UC_KEY_ALIAS: ${{ secrets.UC_KEY_ALIAS || 'androiddebugkey' }}
          UC_KEY_PASSWORD: ${{ secrets.UC_KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Undercover-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "Undercover.apk"

      - name: Publier la release
        if: env.SKIP == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Undercover ${{ env.VERSION }}
          body_path: CHANGELOG-latest.md
          files: |
            Undercover-v${{ env.VERSION }}.apk
            Undercover.apk
